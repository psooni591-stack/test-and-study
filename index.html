<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>파스텔 다이어리 - 나만의 예쁜 일기장</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gamja+Flower&family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel CDN for Babel React JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom Fonts */
        .font-gaegu { font-family: 'Gaegu', cursive; }
        .font-gamja { font-family: 'Gamja Flower', cursive; }
        .font-gowun { font-family: 'Gowun Dodum', sans-serif; }
        .font-noto { font-family: 'Noto Sans KR', sans-serif; }

        /* Smooth scroll & touch behaviors for mobile app feel */
        body {
            font-family: 'Gowun Dodum', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            background-color: #fce7f3;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(244, 114, 182, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(244, 114, 182, 0.7);
        }

        /* Soft glowing pastel animation */
        @keyframes softPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .animate-soft-pulse {
            animation: softPulse 3s infinite ease-in-out;
        }

        @keyframes floatSticker {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(3deg); }
        }
        .animate-float {
            animation: floatSticker 4s infinite ease-in-out;
        }

        /* Glassmorphic soft background */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-4 bg-slate-100">

    <div id="root" class="w-full h-full flex justify-center"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Theme Palette Configs
        const THEMES = {
            pink: {
                id: 'pink',
                name: '딸기 우유 🌸',
                bgClass: 'bg-pink-100',
                appBg: 'bg-gradient-to-br from-pink-100 via-rose-50 to-purple-100',
                primary: 'bg-pink-400',
                primaryHover: 'hover:bg-pink-500',
                textPrimary: 'text-pink-600',
                accentBg: 'bg-pink-200',
                cardBorder: 'border-pink-200',
                badgeBg: 'bg-pink-100 text-pink-700',
                navActive: 'text-pink-500 bg-pink-100',
                gradientBtn: 'bg-gradient-to-r from-pink-400 to-rose-400 text-white',
            },
            lavender: {
                id: 'lavender',
                name: '라벤더 꿈 💜',
                bgClass: 'bg-purple-100',
                appBg: 'bg-gradient-to-br from-purple-100 via-indigo-50 to-pink-100',
                primary: 'bg-purple-400',
                primaryHover: 'hover:bg-purple-500',
                textPrimary: 'text-purple-600',
                accentBg: 'bg-purple-200',
                cardBorder: 'border-purple-200',
                badgeBg: 'bg-purple-100 text-purple-700',
                navActive: 'text-purple-500 bg-purple-100',
                gradientBtn: 'bg-gradient-to-r from-purple-400 to-indigo-400 text-white',
            },
            mint: {
                id: 'mint',
                name: '민트 휴식 🌿',
                bgClass: 'bg-emerald-100',
                appBg: 'bg-gradient-to-br from-emerald-100 via-teal-50 to-sky-100',
                primary: 'bg-emerald-400',
                primaryHover: 'hover:bg-emerald-500',
                textPrimary: 'text-emerald-600',
                accentBg: 'bg-emerald-200',
                cardBorder: 'border-emerald-200',
                badgeBg: 'bg-emerald-100 text-emerald-700',
                navActive: 'text-emerald-600 bg-emerald-100',
                gradientBtn: 'bg-gradient-to-r from-emerald-400 to-teal-400 text-white',
            },
            peach: {
                id: 'peach',
                name: '피치 햇살 🍑',
                bgClass: 'bg-orange-100',
                appBg: 'bg-gradient-to-br from-amber-100 via-orange-50 to-pink-100',
                primary: 'bg-orange-400',
                primaryHover: 'hover:bg-orange-500',
                textPrimary: 'text-orange-600',
                accentBg: 'bg-orange-200',
                cardBorder: 'border-orange-200',
                badgeBg: 'bg-orange-100 text-orange-700',
                navActive: 'text-orange-500 bg-orange-100',
                gradientBtn: 'bg-gradient-to-r from-orange-400 to-amber-400 text-white',
            },
            sky: {
                id: 'sky',
                name: '스카이 구름 ☁️',
                bgClass: 'bg-sky-100',
                appBg: 'bg-gradient-to-br from-sky-100 via-blue-50 to-indigo-100',
                primary: 'bg-sky-400',
                primaryHover: 'hover:bg-sky-500',
                textPrimary: 'text-sky-600',
                accentBg: 'bg-sky-200',
                cardBorder: 'border-sky-200',
                badgeBg: 'bg-sky-100 text-sky-700',
                navActive: 'text-sky-500 bg-sky-100',
                gradientBtn: 'bg-gradient-to-r from-sky-400 to-blue-400 text-white',
            }
        };

        const MOODS = [
            { id: 'happy', emoji: '🥰', label: '행복해요', color: 'bg-pink-100 text-pink-600' },
            { id: 'calm', emoji: '😌', label: '평온해요', color: 'bg-blue-100 text-blue-600' },
            { id: 'excited', emoji: '🥳', label: '신나요', color: 'bg-yellow-100 text-yellow-700' },
            { id: 'proud', emoji: '✨', label: '뿌듯해요', color: 'bg-purple-100 text-purple-600' },
            { id: 'tired', emoji: '🥱', label: '피곤해요', color: 'bg-gray-100 text-gray-600' },
            { id: 'sad', emoji: '🥺', label: '슬퍼요', color: 'bg-indigo-100 text-indigo-600' },
            { id: 'angry', emoji: '😤', label: '속상해요', color: 'bg-red-100 text-red-600' }
        ];

        const WEATHERS = [
            { id: 'sunny', icon: 'fa-sun', label: '맑음', color: 'text-amber-500' },
            { id: 'cloudy', icon: 'fa-cloud', label: '구름', color: 'text-slate-400' },
            { id: 'rainy', icon: 'fa-cloud-showers-heavy', label: '비', color: 'text-blue-400' },
            { id: 'snowy', icon: 'fa-snowflake', label: '눈', color: 'text-sky-300' },
            { id: 'windy', icon: 'fa-wind', label: '바람', color: 'text-teal-400' },
            { id: 'rainbow', icon: 'fa-rainbow', label: '무지개', color: 'text-pink-400' }
        ];

        const STICKERS = ['🌸', '🧸', '☕', '🎀', '🌙', '🍓', '🐱', '🍀', '☁️', '🎨', '🌷', '🧁', '⭐', '🎈', '💌', '🐾'];

        // Initial Mock Data
        const INITIAL_ENTRIES = [
            {
                id: '1',
                date: new Date().toISOString().split('T')[0],
                time: '21:30',
                title: '오늘의 따뜻한 라떼 한 잔 ☕',
                content: '오늘은 조용한 카페에 가서 다이어리를 적었다. 창밖에 살랑살랑 불어오는 바람을 느끼며 제일 좋아하는 바닐라 라떼를 마셨다. 소소하지만 마음이 꽉 차는 행복한 하루였다! 💕',
                mood: 'happy',
                weather: 'sunny',
                tags: ['카페', '힐링', '소소한행복'],
                stickers: ['☕', '🌸', '🧸'],
                font: 'font-gowun',
                image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3'
            },
            {
                id: '2',
                date: new Date(Date.now() - 86400000).toISOString().split('T')[0],
                time: '22:15',
                title: '산책길에서 발견한 예쁜 꽃 🌷',
                content: '퇴근길에 집 앞 공원을 걸었다. 길가에 예쁘게 피어난 튜립을 발견해서 사진으로 남겼다. 하루 종일 지쳤던 마음이 포근하게 녹아내리는 기분이었다.',
                mood: 'calm',
                weather: 'cloudy',
                tags: ['산책', '꽃', '퇴근길'],
                stickers: ['🌷', '🍀'],
                font: 'font-gaegu',
                image: 'https://images.unsplash.com/photo-1520763185298-1b434c919102?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3'
            }
        ];

        // Simple Web Audio API Sound Effects (Soft Pastel Bubble Pop)
        const playBubbleSound = () => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.08);
                
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.09);
            } catch (e) {
                // Audio context block silent handling
            }
        };

        function App() {
            // App state
            const [activeTab, setActiveTab] = useState('calendar'); // 'calendar', 'list', 'write', 'stats', 'settings'
            const [themeKey, setThemeKey] = useState('pink');
            const [fontStyle, setFontStyle] = useState('font-gowun'); // 'font-gowun', 'font-gaegu', 'font-gamja', 'font-noto'
            const [soundEnabled, setSoundEnabled] = useState(true);
            const [entries, setEntries] = useState(() => {
                const saved = localStorage.getItem('pastel_diary_entries');
                return saved ? JSON.parse(saved) : INITIAL_ENTRIES;
            });

            // Lock screen state
            const [isLocked, setIsLocked] = useState(false);
            const [pinCode, setPinCode] = useState(() => localStorage.getItem('pastel_diary_pin') || '');
            const [inputPin, setInputPin] = useState('');
            const [pinError, setPinError] = useState(false);

            // Active entry for viewing/editing
            const [selectedEntryId, setSelectedEntryId] = useState(null);
            const [selectedDateFilter, setSelectedDateFilter] = useState(new Date().toISOString().split('T')[0]);

            const currentTheme = THEMES[themeKey] || THEMES.pink;

            // Save entries to LocalStorage
            useEffect(() => {
                localStorage.setItem('pastel_diary_entries', JSON.stringify(entries));
            }, [entries]);

            const triggerSound = () => {
                if (soundEnabled) playBubbleSound();
            };

            const changeTab = (tab) => {
                triggerSound();
                setActiveTab(tab);
            };

            // Add or Update Entry
            const handleSaveEntry = (entryData) => {
                triggerSound();
                if (entryData.id) {
                    setEntries(prev => prev.map(e => e.id === entryData.id ? entryData : e));
                } else {
                    const newEntry = {
                        ...entryData,
                        id: Date.now().toString(),
                    };
                    setEntries(prev => [newEntry, ...prev]);
                }
                setActiveTab('calendar');
                setSelectedEntryId(null);
            };

            // Delete Entry
            const handleDeleteEntry = (id) => {
                triggerSound();
                if (confirm('이 일기를 정말 삭제할까요?')) {
                    setEntries(prev => prev.filter(e => e.id !== id));
                    setSelectedEntryId(null);
                    setActiveTab('calendar');
                }
            };

            // Lock PIN Handler
            const handlePinSubmit = (digit) => {
                triggerSound();
                if (inputPin.length < 4) {
                    const nextPin = inputPin + digit;
                    setInputPin(nextPin);
                    if (nextPin.length === 4) {
                        if (nextPin === pinCode) {
                            setIsLocked(false);
                            setInputPin('');
                            setPinError(false);
                        } else {
                            setPinError(true);
                            setTimeout(() => {
                                setInputPin('');
                                setPinError(false);
                            }, 800);
                        }
                    }
                }
            };

            const unlockBypass = () => {
                setIsLocked(false);
                setInputPin('');
            };

            return (
                <div class={`w-full max-w-md h-[100vh] md:h-[92vh] md:max-h-[850px] ${currentTheme.appBg} flex flex-col md:rounded-[40px] shadow-2xl overflow-hidden relative border-0 md:border-8 border-white/80 ${fontStyle}`}>
                    
                    {/* Top Status Bar (Smartphone Style) */}
                    <div class="pt-2 px-6 pb-1 flex justify-between items-center text-xs text-slate-500 font-semibold select-none z-20">
                        <span>{new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}</span>
                        <div class="flex items-center space-x-1.5">
                            <i class="fas font-solid fa-wifi text-[11px]"></i>
                            <i class="fas fa-battery-three-quarters text-[12px]"></i>
                        </div>
                    </div>

                    {/* App Header Bar */}
                    <header class="px-5 py-3 flex justify-between items-center z-10">
                        <div class="flex items-center space-x-2">
                            <div class={`w-9 h-9 rounded-2xl ${currentTheme.primary} text-white flex items-center justify-center shadow-md animate-soft-pulse`}>
                                <i class="fas fa-book-open text-base"></i>
                            </div>
                            <div>
                                <h1 class={`text-lg font-bold ${currentTheme.textPrimary} leading-tight`}>파스텔 다이어리</h1>
                                <p class="text-[11px] text-slate-400">오늘의 소중한 기억 🌸</p>
                            </div>
                        </div>

                        <div class="flex items-center space-x-2">
                            {pinCode && (
                                <button 
                                    onClick={() => { triggerSound(); setIsLocked(true); }}
                                    class="w-8 h-8 rounded-full bg-white/80 text-slate-500 hover:text-pink-500 flex items-center justify-center shadow-sm text-xs transition"
                                    title="잠그기"
                                >
                                    <i class="fas fa-lock"></i>
                                </button>
                            )}
                            <button 
                                onClick={() => {
                                    setSelectedEntryId(null);
                                    changeTab('write');
                                }}
                                class={`px-3 py-1.5 rounded-full ${currentTheme.gradientBtn} text-xs font-bold shadow-md hover:opacity-90 transition flex items-center space-x-1`}
                            >
                                <i class="fas fa-plus text-[10px]"></i>
                                <span>새 일기</span>
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area (Scrollable Screen) */}
                    <main class="flex-1 overflow-y-auto px-4 py-2 relative z-10 pb-20">
                        {activeTab === 'calendar' && (
                            <CalendarView 
                                entries={entries} 
                                theme={currentTheme}
                                selectedDate={selectedDateFilter}
                                onSelectDate={(date) => {
                                    setSelectedDateFilter(date);
                                }}
                                onOpenEntry={(id) => {
                                    setSelectedEntryId(id);
                                    setActiveTab('detail');
                                }}
                                onNewEntryForDate={(date) => {
                                    setSelectedDateFilter(date);
                                    setSelectedEntryId(null);
                                    setActiveTab('write');
                                }}
                                triggerSound={triggerSound}
                            />
                        )}

                        {activeTab === 'list' && (
                            <ListView 
                                entries={entries} 
                                theme={currentTheme}
                                onSelectEntry={(id) => {
                                    setSelectedEntryId(id);
                                    setActiveTab('detail');
                                }}
                                triggerSound={triggerSound}
                            />
                        )}

                        {activeTab === 'write' && (
                            <WriteView 
                                theme={currentTheme}
                                existingEntry={entries.find(e => e.id === selectedEntryId)}
                                defaultDate={selectedDateFilter}
                                onSave={handleSaveEntry}
                                onCancel={() => {
                                    triggerSound();
                                    setActiveTab('calendar');
                                }}
                                fontStyle={fontStyle}
                            />
                        )}

                        {activeTab === 'detail' && (
                            <DetailView 
                                entry={entries.find(e => e.id === selectedEntryId)}
                                theme={currentTheme}
                                onEdit={() => {
                                    triggerSound();
                                    setActiveTab('write');
                                }}
                                onDelete={handleDeleteEntry}
                                onBack={() => {
                                    triggerSound();
                                    setActiveTab('calendar');
                                }}
                            />
                        )}

                        {activeTab === 'stats' && (
                            <StatsView 
                                entries={entries} 
                                theme={currentTheme}
                            />
                        )}

                        {activeTab === 'settings' && (
                            <SettingsView 
                                theme={currentTheme}
                                themeKey={themeKey}
                                onChangeTheme={setThemeKey}
                                fontStyle={fontStyle}
                                onChangeFont={setFontStyle}
                                soundEnabled={soundEnabled}
                                onToggleSound={setSoundEnabled}
                                pinCode={pinCode}
                                onSetPin={setPinCode}
                                entries={entries}
                                onImportEntries={setEntries}
                                triggerSound={triggerSound}
                            />
                        )}
                    </main>

                    {/* Bottom Navigation Bar */}
                    <nav class="absolute bottom-0 left-0 right-0 h-16 glass-card border-t border-white/60 flex justify-around items-center px-2 z-20 shadow-lg">
                        <NavButton 
                            icon="fa-calendar-days" 
                            label="달력" 
                            active={activeTab === 'calendar'} 
                            onClick={() => changeTab('calendar')}
                            theme={currentTheme}
                        />
                        <NavButton 
                            icon="fa-book" 
                            label="일기장" 
                            active={activeTab === 'list'} 
                            onClick={() => changeTab('list')}
                            theme={currentTheme}
                        />
                        <NavButton 
                            icon="fa-pen-heart" 
                            label="작성" 
                            active={activeTab === 'write'} 
                            onClick={() => {
                                setSelectedEntryId(null);
                                changeTab('write');
                            }}
                            theme={currentTheme}
                            isCenter={true}
                        />
                        <NavButton 
                            icon="fa-chart-pie" 
                            label="감정분석" 
                            active={activeTab === 'stats'} 
                            onClick={() => changeTab('stats')}
                            theme={currentTheme}
                        />
                        <NavButton 
                            icon="fa-sliders" 
                            label="설정" 
                            active={activeTab === 'settings'} 
                            onClick={() => changeTab('settings')}
                            theme={currentTheme}
                        />
                    </nav>

                    {/* Lock Screen Modal */}
                    {isLocked && (
                        <LockScreenOverlay 
                            inputPin={inputPin}
                            pinError={pinError}
                            onDigit={handlePinSubmit}
                            onDelete={() => { triggerSound(); setInputPin(prev => prev.slice(0, -1)); }}
                            onBypass={unlockBypass}
                            theme={currentTheme}
                        />
                    )}
                </div>
            );
        }

        // Navigation Button Component
        function NavButton({ icon, label, active, onClick, theme, isCenter }) {
            if (isCenter) {
                return (
                    <button 
                        onClick={onClick}
                        class={`-mt-6 w-12 h-12 rounded-full ${theme.gradientBtn} flex flex-col items-center justify-center shadow-lg transform active:scale-95 transition-all`}
                    >
                        <i class="fas fa-plus text-lg"></i>
                    </button>
                );
            }

            return (
                <button 
                    onClick={onClick}
                    class={`flex flex-col items-center justify-center w-14 py-1 rounded-2xl transition-all ${
                        active ? `${theme.textPrimary} font-bold` : 'text-slate-400 hover:text-slate-600'
                    }`}
                >
                    <i class={`fas ${icon} text-lg mb-0.5 ${active ? 'scale-110' : ''} transition-transform`}></i>
                    <span class="text-[10px]">{label}</span>
                </button>
            );
        }

        function CalendarView({ entries, theme, selectedDate, onSelectDate, onOpenEntry, onNewEntryForDate, triggerSound }) {
            const [currentYearMonth, setCurrentYearMonth] = useState(() => {
                const today = new Date();
                return { year: today.getFullYear(), month: today.getMonth() };
            });

            const { year, month } = currentYearMonth;

            // Generate Calendar days
            const calendarDays = useMemo(() => {
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const days = [];

                // Empty slots before 1st day
                for (let i = 0; i < firstDay; i++) {
                    days.push(null);
                }
                // Actual days
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    days.push({
                        dayNumber: d,
                        dateStr: dateStr,
                        entry: entries.find(e => e.date === dateStr)
                    });
                }
                return days;
            }, [year, month, entries]);

            const changeMonth = (delta) => {
                triggerSound();
                setCurrentYearMonth(prev => {
                    let newM = prev.month + delta;
                    let newY = prev.year;
                    if (newM < 0) { newM = 11; newY--; }
                    if (newM > 11) { newM = 0; newY++; }
                    return { year: newY, month: newM };
                });
            };

            const activeDayEntries = entries.filter(e => e.date === selectedDate);

            return (
                <div class="space-y-4">
                    {/* Month Picker Header */}
                    <div class="glass-card p-4 rounded-3xl shadow-sm flex items-center justify-between">
                        <button 
                            onClick={() => changeMonth(-1)}
                            class="w-8 h-8 rounded-full bg-white text-slate-600 shadow-xs hover:bg-slate-50 flex items-center justify-center text-xs"
                        >
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <div class="text-center">
                            <h2 class="text-base font-bold text-slate-800">
                                {year}년 {month + 1}월
                            </h2>
                            <p class="text-[11px] text-slate-400">이번 달 기록된 일기 {entries.filter(e => e.date.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`)).length}개</p>
                        </div>
                        <button 
                            onClick={() => changeMonth(1)}
                            class="w-8 h-8 rounded-full bg-white text-slate-600 shadow-xs hover:bg-slate-50 flex items-center justify-center text-xs"
                        >
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>

                    {/* Calendar Grid */}
                    <div class="glass-card p-4 rounded-3xl shadow-sm">
                        {/* Day names */}
                        <div class="grid grid-cols-7 text-center text-xs font-semibold text-slate-400 mb-2">
                            <span class="text-rose-400">일</span>
                            <span>월</span>
                            <span>화</span>
                            <span>수</span>
                            <span>목</span>
                            <span>금</span>
                            <span class="text-sky-400">토</span>
                        </div>

                        {/* Date Cells */}
                        <div class="grid grid-cols-7 gap-1">
                            {calendarDays.map((item, idx) => {
                                if (!item) return <div key={`empty-${idx}`} class="h-11"></div>;

                                const isToday = item.dateStr === new Date().toISOString().split('T')[0];
                                const isSelected = item.dateStr === selectedDate;
                                const moodObj = item.entry ? MOODS.find(m => m.id === item.entry.mood) : null;

                                return (
                                    <button
                                        key={item.dateStr}
                                        onClick={() => {
                                            triggerSound();
                                            onSelectDate(item.dateStr);
                                        }}
                                        class={`h-11 rounded-2xl flex flex-col items-center justify-center relative transition-all ${
                                            isSelected 
                                                ? 'ring-2 ring-pink-400 bg-white shadow-md font-bold' 
                                                : isToday 
                                                ? 'bg-pink-50 text-pink-600 font-bold' 
                                                : 'hover:bg-white/60 text-slate-700'
                                        }`}
                                    >
                                        <span class="text-xs">{item.dayNumber}</span>
                                        {moodObj ? (
                                            <span class="text-xs leading-none mt-0.5">{moodObj.emoji}</span>
                                        ) : (
                                            <span class="w-1 h-1 rounded-full bg-slate-200 mt-1"></span>
                                        )}
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Selected Date Entries List */}
                    <div class="space-y-2">
                        <div class="flex items-center justify-between px-2">
                            <h3 class="text-xs font-bold text-slate-600">
                                📅 {selectedDate} 의 이야기
                            </h3>
                            <button 
                                onClick={() => onNewEntryForDate(selectedDate)}
                                class={`text-xs ${theme.textPrimary} font-semibold hover:underline flex items-center space-x-1`}
                            >
                                <i class="fas fa-plus text-[10px]"></i>
                                <span>이 날짜에 쓰기</span>
                            </button>
                        </div>

                        {activeDayEntries.length > 0 ? (
                            activeDayEntries.map(entry => (
                                <JournalCard key={entry.id} entry={entry} theme={theme} onClick={() => onOpenEntry(entry.id)} />
                            ))
                        ) : (
                            <div class="glass-card p-6 rounded-3xl text-center space-y-2">
                                <div class="text-2xl animate-float">📝</div>
                                <p class="text-xs text-slate-500">이 날의 작성된 일기가 없어요.</p>
                                <button 
                                    onClick={() => onNewEntryForDate(selectedDate)}
                                    class={`px-4 py-1.5 rounded-full ${theme.gradientBtn} text-xs font-bold shadow-xs hover:opacity-90`}
                                >
                                    첫 마음 기록하기
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function ListView({ entries, theme, onSelectEntry, triggerSound }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [filterMood, setFilterMood] = useState('all');

            const filteredEntries = entries.filter(e => {
                const matchSearch = e.title.includes(searchTerm) || e.content.includes(searchTerm) || e.tags.some(t => t.includes(searchTerm));
                const matchMood = filterMood === 'all' || e.mood === filterMood;
                return matchSearch && matchMood;
            });

            return (
                <div class="space-y-3">
                    {/* Search & Filter Bar */}
                    <div class="glass-card p-3 rounded-3xl space-y-2 shadow-sm">
                        <div class="relative flex items-center">
                            <i class="fas fa-search absolute left-3.5 text-xs text-slate-400"></i>
                            <input 
                                type="text"
                                placeholder="일기 제목, 내용, 태그 검색..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                class="w-full pl-9 pr-4 py-2 rounded-2xl text-xs bg-white/80 border-0 focus:ring-2 focus:ring-pink-300 outline-none placeholder:text-slate-400"
                            />
                        </div>

                        {/* Mood Filter Pill */}
                        <div class="flex items-center space-x-1.5 overflow-x-auto pb-1 no-scrollbar text-xs">
                            <button 
                                onClick={() => { triggerSound(); setFilterMood('all'); }}
                                class={`px-3 py-1 rounded-full whitespace-nowrap transition ${
                                    filterMood === 'all' ? `${theme.primary} text-white font-bold` : 'bg-white/80 text-slate-600'
                                }`}
                            >
                                전체 ({entries.length})
                            </button>
                            {MOODS.map(m => (
                                <button
                                    key={m.id}
                                    onClick={() => { triggerSound(); setFilterMood(m.id); }}
                                    class={`px-2.5 py-1 rounded-full whitespace-nowrap transition flex items-center space-x-1 ${
                                        filterMood === m.id ? `${theme.primary} text-white font-bold` : 'bg-white/80 text-slate-600'
                                    }`}
                                >
                                    <span>{m.emoji}</span>
                                    <span>{m.label}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Entry Cards List */}
                    <div class="space-y-2.5">
                        {filteredEntries.length > 0 ? (
                            filteredEntries.map(entry => (
                                <JournalCard key={entry.id} entry={entry} theme={theme} onClick={() => onSelectEntry(entry.id)} />
                            ))
                        ) : (
                            <div class="glass-card p-8 rounded-3xl text-center space-y-2">
                                <div class="text-3xl">🔍</div>
                                <p class="text-xs text-slate-500">조건에 맞는 일기가 없어요.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Shared Journal Card
        function JournalCard({ entry, theme, onClick }) {
            const moodObj = MOODS.find(m => m.id === entry.mood) || MOODS[0];
            const weatherObj = WEATHERS.find(w => w.id === entry.weather);

            return (
                <div 
                    onClick={onClick}
                    class="glass-card p-4 rounded-3xl shadow-sm hover:shadow-md transition cursor-pointer space-y-2 border border-white/80"
                >
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class={`px-2.5 py-0.5 rounded-full text-xs font-medium ${moodObj.color}`}>
                                {moodObj.emoji} {moodObj.label}
                            </span>
                            {weatherObj && (
                                <i class={`fas ${weatherObj.icon} ${weatherObj.color} text-xs`}></i>
                            )}
                        </div>
                        <span class="text-[11px] text-slate-400">{entry.date} ({entry.time || '저녁'})</span>
                    </div>

                    <h3 class="text-sm font-bold text-slate-800 line-clamp-1">{entry.title}</h3>
                    <p class="text-xs text-slate-600 line-clamp-2 leading-relaxed">{entry.content}</p>

                    {/* Image Preview if exists */}
                    {entry.image && (
                        <div class="h-28 w-full rounded-2xl overflow-hidden shadow-xs mt-1">
                            <img src={entry.image} alt="Diary attached" class="w-full h-full object-cover" />
                        </div>
                    )}

                    {/* Tags & Stickers */}
                    <div class="flex items-center justify-between pt-1">
                        <div class="flex items-center space-x-1 flex-wrap">
                            {entry.tags && entry.tags.map((tag, idx) => (
                                <span key={idx} class="text-[10px] text-slate-500 bg-white/80 px-2 py-0.5 rounded-md">
                                    #{tag}
                                </span>
                            ))}
                        </div>
                        <div class="flex items-center space-x-1">
                            {entry.stickers && entry.stickers.map((stk, idx) => (
                                <span key={idx} class="text-sm">{stk}</span>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function WriteView({ theme, existingEntry, defaultDate, onSave, onCancel, fontStyle }) {
            const [title, setTitle] = useState(existingEntry ? existingEntry.title : '');
            const [content, setContent] = useState(existingEntry ? existingEntry.content : '');
            const [date, setDate] = useState(existingEntry ? existingEntry.date : (defaultDate || new Date().toISOString().split('T')[0]));
            const [time, setTime] = useState(existingEntry ? existingEntry.time : new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }));
            const [mood, setMood] = useState(existingEntry ? existingEntry.mood : 'happy');
            const [weather, setWeather] = useState(existingEntry ? existingEntry.weather : 'sunny');
            const [tagInput, setTagInput] = useState('');
            const [tags, setTags] = useState(existingEntry ? existingEntry.tags : ['일상']);
            const [stickers, setStickers] = useState(existingEntry ? existingEntry.stickers : ['🌸']);
            const [image, setImage] = useState(existingEntry ? existingEntry.image : '');

            const handleAddTag = (e) => {
                if (e.key === 'Enter' && tagInput.trim()) {
                    e.preventDefault();
                    if (!tags.includes(tagInput.trim())) {
                        setTags([...tags, tagInput.trim()]);
                    }
                    setTagInput('');
                }
            };

            const removeTag = (tagToRemove) => {
                setTags(tags.filter(t => t !== tagToRemove));
            };

            const toggleSticker = (stk) => {
                if (stickers.includes(stk)) {
                    setStickers(stickers.filter(s => s !== stk));
                } else {
                    if (stickers.length < 5) {
                        setStickers([...stickers, stk]);
                    }
                }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setImage(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleFormSubmit = (e) => {
                e.preventDefault();
                if (!title.trim() || !content.trim()) {
                    alert('제목과 내용을 적어주세요 💕');
                    return;
                }

                onSave({
                    id: existingEntry ? existingEntry.id : null,
                    date,
                    time,
                    title,
                    content,
                    mood,
                    weather,
                    tags,
                    stickers,
                    image
                });
            };

            return (
                <form onSubmit={handleFormSubmit} class="space-y-3 pb-4">
                    <div class="flex items-center justify-between px-1">
                        <h2 class="text-sm font-bold text-slate-700">
                            {existingEntry ? '일기 수정하기 ✨' : '오늘의 마음 쓰기 ✨'}
                        </h2>
                        <div class="flex space-x-2">
                            <button 
                                type="button" 
                                onClick={onCancel} 
                                class="px-3 py-1 rounded-full bg-slate-200 text-slate-600 text-xs font-semibold hover:bg-slate-300"
                            >
                                취소
                            </button>
                            <button 
                                type="submit" 
                                class={`px-4 py-1 rounded-full ${theme.gradientBtn} text-xs font-bold shadow-md hover:opacity-90`}
                            >
                                저장
                            </button>
                        </div>
                    </div>

                    {/* Date and Weather Row */}
                    <div class="glass-card p-3 rounded-3xl space-y-3">
                        <div class="flex items-center space-x-2 text-xs">
                            <input 
                                type="date" 
                                value={date} 
                                onChange={(e) => setDate(e.target.value)}
                                class="bg-white/80 border-0 rounded-xl px-2.5 py-1 text-slate-700 font-semibold focus:ring-1 focus:ring-pink-300 outline-none"
                            />
                            <input 
                                type="time" 
                                value={time} 
                                onChange={(e) => setTime(e.target.value)}
                                class="bg-white/80 border-0 rounded-xl px-2.5 py-1 text-slate-700 font-semibold focus:ring-1 focus:ring-pink-300 outline-none"
                            />
                        </div>

                        {/* Weather Selection */}
                        <div>
                            <label class="text-[11px] text-slate-400 block mb-1">오늘의 날씨</label>
                            <div class="flex items-center space-x-2 overflow-x-auto pb-1 no-scrollbar">
                                {WEATHERS.map(w => (
                                    <button
                                        type="button"
                                        key={w.id}
                                        onClick={() => setWeather(w.id)}
                                        class={`px-3 py-1 rounded-xl text-xs flex items-center space-x-1.5 transition ${
                                            weather === w.id ? `${theme.primary} text-white font-bold shadow-xs` : 'bg-white/80 text-slate-600'
                                        }`}
                                    >
                                        <i class={`fas ${w.icon} ${weather === w.id ? 'text-white' : w.color}`}></i>
                                        <span>{w.label}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Mood Selection */}
                        <div>
                            <label class="text-[11px] text-slate-400 block mb-1">오늘의 감정 스탬프</label>
                            <div class="grid grid-cols-4 gap-1.5">
                                {MOODS.map(m => (
                                    <button
                                        type="button"
                                        key={m.id}
                                        onClick={() => setMood(m.id)}
                                        class={`p-1.5 rounded-2xl text-xs flex flex-col items-center justify-center transition border ${
                                            mood === m.id 
                                                ? `${theme.primary} text-white border-transparent shadow-xs font-bold scale-105` 
                                                : 'bg-white/80 border-slate-100 text-slate-700'
                                        }`}
                                    >
                                        <span class="text-lg">{m.emoji}</span>
                                        <span class="text-[10px] mt-0.5">{m.label}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Title & Content Input */}
                    <div class="glass-card p-4 rounded-3xl space-y-3">
                        <input 
                            type="text" 
                            placeholder="일기 제목을 작성해 보세요..."
                            value={title}
                            onChange={(e) => setTitle(e.target.value)}
                            class="w-full bg-transparent text-sm font-bold text-slate-800 border-b border-slate-200 pb-2 focus:border-pink-400 outline-none placeholder:text-slate-400"
                        />

                        <textarea 
                            rows="6"
                            placeholder="오늘 당신의 하루는 어땠나요? 차근차근 남겨보세요..."
                            value={content}
                            onChange={(e) => setContent(e.target.value)}
                            class={`w-full bg-transparent text-xs leading-relaxed text-slate-700 border-0 outline-none resize-none placeholder:text-slate-400 ${fontStyle}`}
                        ></textarea>

                        {/* Image Preview & Upload */}
                        <div>
                            <label class="text-[11px] text-slate-400 block mb-1">사진 첨부하기</label>
                            {image ? (
                                <div class="relative w-full h-36 rounded-2xl overflow-hidden group">
                                    <img src={image} alt="Upload preview" class="w-full h-full object-cover" />
                                    <button 
                                        type="button"
                                        onClick={() => setImage('')}
                                        class="absolute top-2 right-2 bg-black/50 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs hover:bg-black/70"
                                    >
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            ) : (
                                <label class="w-full h-20 border-2 border-dashed border-pink-200 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:bg-white/50 transition">
                                    <i class="fas fa-camera text-pink-300 text-lg mb-1"></i>
                                    <span class="text-[11px] text-slate-400">사진 클릭하여 올리기</span>
                                    <input type="file" accept="image/*" onChange={handleImageUpload} class="hidden" />
                                </label>
                            )}
                        </div>
                    </div>

                    {/* Stickers Deco */}
                    <div class="glass-card p-3 rounded-3xl space-y-2">
                        <label class="text-[11px] text-slate-400 block">파스텔 스티커로 꾸미기 (최대 5개)</label>
                        <div class="flex items-center space-x-2 overflow-x-auto pb-1 no-scrollbar text-lg">
                            {STICKERS.map((stk, idx) => (
                                <button
                                    type="button"
                                    key={idx}
                                    onClick={() => toggleSticker(stk)}
                                    class={`p-1.5 rounded-xl transition ${
                                        stickers.includes(stk) ? 'bg-pink-200 scale-110 shadow-xs' : 'hover:bg-white/60'
                                    }`}
                                >
                                    {stk}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Tags */}
                    <div class="glass-card p-3 rounded-3xl space-y-2">
                        <label class="text-[11px] text-slate-400 block">태그 추가 (엔터 입력)</label>
                        <div class="flex flex-wrap items-center gap-1.5">
                            {tags.map((t, idx) => (
                                <span key={idx} class="bg-white px-2.5 py-1 rounded-xl text-xs text-slate-600 flex items-center space-x-1 shadow-2xs">
                                    <span>#{t}</span>
                                    <button type="button" onClick={() => removeTag(t)} class="text-slate-400 hover:text-slate-600">
                                        <i class="fas fa-times text-[10px]"></i>
                                    </button>
                                </span>
                            ))}
                            <input 
                                type="text"
                                placeholder="#태그입력..."
                                value={tagInput}
                                onChange={(e) => setTagInput(e.target.value)}
                                onKeyDown={handleAddTag}
                                class="bg-white/80 text-xs px-2.5 py-1 rounded-xl outline-none focus:ring-1 focus:ring-pink-300 w-24"
                            />
                        </div>
                    </div>
                </form>
            );
        }

        function DetailView({ entry, theme, onEdit, onDelete, onBack }) {
            if (!entry) return null;

            const moodObj = MOODS.find(m => m.id === entry.mood) || MOODS[0];
            const weatherObj = WEATHERS.find(w => w.id === entry.weather);

            return (
                <div class="space-y-4 pb-4">
                    {/* Top Action Bar */}
                    <div class="flex items-center justify-between px-1">
                        <button 
                            onClick={onBack}
                            class="w-8 h-8 rounded-full bg-white text-slate-600 shadow-xs flex items-center justify-center text-xs hover:bg-slate-50"
                        >
                            <i class="fas fa-arrow-left"></i>
                        </button>

                        <div class="flex space-x-2">
                            <button 
                                onClick={onEdit}
                                class="px-3 py-1 rounded-full bg-white text-slate-600 shadow-xs text-xs font-semibold hover:bg-slate-50"
                            >
                                <i class="fas fa-pen text-[10px] mr-1"></i> 수정
                            </button>
                            <button 
                                onClick={() => onDelete(entry.id)}
                                class="px-3 py-1 rounded-full bg-rose-100 text-rose-600 shadow-xs text-xs font-semibold hover:bg-rose-200"
                            >
                                <i class="fas fa-trash text-[10px] mr-1"></i> 삭제
                            </button>
                        </div>
                    </div>

                    {/* Card Article Container */}
                    <article class="glass-card p-5 rounded-3xl shadow-sm space-y-4 border border-white">
                        {/* Date Header */}
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                            <div>
                                <span class="text-xs text-slate-400">{entry.date} ({entry.time})</span>
                                <h2 class="text-lg font-bold text-slate-800 mt-0.5">{entry.title}</h2>
                            </div>
                            <div class="text-right">
                                <span class={`inline-block px-3 py-1 rounded-full text-xs font-bold ${moodObj.color}`}>
                                    {moodObj.emoji} {moodObj.label}
                                </span>
                                {weatherObj && (
                                    <div class="text-[11px] text-slate-400 mt-1 flex items-center justify-end space-x-1">
                                        <i class={`fas ${weatherObj.icon} ${weatherObj.color}`}></i>
                                        <span>{weatherObj.label}</span>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Image Preview */}
                        {entry.image && (
                            <div class="w-full h-48 rounded-2xl overflow-hidden shadow-xs">
                                <img src={entry.image} alt="Diary attachment" class="w-full h-full object-cover" />
                            </div>
                        )}

                        {/* Content */}
                        <p class="text-xs text-slate-700 leading-relaxed whitespace-pre-wrap min-h-[100px]">
                            {entry.content}
                        </p>

                        {/* Stickers Line */}
                        {entry.stickers && entry.stickers.length > 0 && (
                            <div class="flex items-center space-x-2 pt-2 border-t border-slate-100">
                                <span class="text-[10px] text-slate-400">스티커:</span>
                                <div class="flex space-x-1.5 text-lg">
                                    {entry.stickers.map((stk, idx) => (
                                        <span key={idx} class="animate-bounce" style={{ animationDelay: `${idx * 0.2}s` }}>{stk}</span>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Tags */}
                        {entry.tags && entry.tags.length > 0 && (
                            <div class="flex flex-wrap gap-1 pt-1">
                                {entry.tags.map((t, idx) => (
                                    <span key={idx} class="text-[10px] bg-pink-50 text-pink-600 px-2.5 py-0.5 rounded-full">
                                        #{t}
                                    </span>
                                ))}
                            </div>
                        )}
                    </article>
                </div>
            );
        }

        function StatsView({ entries, theme }) {
            // Mood Stats Calculation
            const moodCounts = useMemo(() => {
                const counts = {};
                MOODS.forEach(m => counts[m.id] = 0);
                entries.forEach(e => {
                    if (counts[e.mood] !== undefined) counts[e.mood]++;
                });
                return counts;
            }, [entries]);

            const totalEntries = entries.length;

            // Warm AI Quote
            const quotes = [
                "매일매일 일기를 적어가는 당신의 정성이 아름다워요 🌸",
                "지친 하루 끝에 자신을 돌아보는 소중한 시간이에요 ✨",
                "어떤 감정이든 소중한 나의 한 부분입니다 💕",
                "오늘도 수고 많았어요, 내일은 더 따뜻할 거예요 ☕"
            ];
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];

            return (
                <div class="space-y-4">
                    {/* Encouragement Card */}
                    <div class="glass-card p-5 rounded-3xl shadow-sm text-center space-y-2 relative overflow-hidden">
                        <div class="text-3xl animate-float">💖</div>
                        <h2 class="text-sm font-bold text-slate-800">나의 감정 리포트</h2>
                        <p class="text-xs text-slate-500 leading-relaxed px-2">{randomQuote}</p>
                        <div class="pt-2 text-xs font-semibold text-pink-500">
                            총 {totalEntries}개의 마음 기록됨
                        </div>
                    </div>

                    {/* Mood Distribution */}
                    <div class="glass-card p-4 rounded-3xl space-y-3">
                        <h3 class="text-xs font-bold text-slate-700">감정 분포 통계</h3>
                        <div class="space-y-2">
                            {MOODS.map(m => {
                                const count = moodCounts[m.id] || 0;
                                const percent = totalEntries > 0 ? Math.round((count / totalEntries) * 100) : 0;
                                return (
                                    <div key={m.id} class="space-y-1">
                                        <div class="flex justify-between text-xs text-slate-600">
                                            <span class="flex items-center space-x-1">
                                                <span>{m.emoji}</span>
                                                <span>{m.label}</span>
                                            </span>
                                            <span class="font-semibold">{count}회 ({percent}%)</span>
                                        </div>
                                        <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                                            <div 
                                                class={`h-full ${theme.primary} transition-all duration-500`}
                                                style={{ width: `${percent}%` }}
                                            ></div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function SettingsView({ theme, themeKey, onChangeTheme, fontStyle, onChangeFont, soundEnabled, onToggleSound, pinCode, onSetPin, entries, onImportEntries, triggerSound }) {
            const [newPin, setNewPin] = useState('');

            const handlePinChange = () => {
                if (newPin.length === 4 || newPin === '') {
                    onSetPin(newPin);
                    localStorage.setItem('pastel_diary_pin', newPin);
                    alert(newPin ? '암호 잠금이 설정되었습니다 🔐' : '암호 잠금이 해제되었습니다 🔓');
                    setNewPin('');
                } else {
                    alert('4자리 숫자를 입력해 주세요!');
                }
            };

            const exportData = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `pastel_diary_backup_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            if (Array.isArray(parsed)) {
                                onImportEntries(parsed);
                                alert('성공적으로 일기를 복원했습니다! 🌸');
                            }
                        } catch (err) {
                            alert('올바른 백업 파일이 아닙니다.');
                        }
                    };
                    reader.readAsText(file);
                }
            };

            return (
                <div class="space-y-4 pb-4">
                    <h2 class="text-sm font-bold text-slate-700 px-1">다이어리 설정 ⚙️️</h2>

                    {/* Theme Picker */}
                    <div class="glass-card p-4 rounded-3xl space-y-3">
                        <h3 class="text-xs font-bold text-slate-700">파스텔 테마 선택</h3>
                        <div class="grid grid-cols-2 gap-2">
                            {Object.values(THEMES).map(t => (
                                <button
                                    key={t.id}
                                    onClick={() => { triggerSound(); onChangeTheme(t.id); }}
                                    class={`p-2.5 rounded-2xl text-xs font-semibold flex items-center justify-between border transition ${
                                        themeKey === t.id ? `${t.primary} text-white border-transparent shadow-xs` : 'bg-white/80 border-slate-100 text-slate-700'
                                    }`}
                                >
                                    <span>{t.name}</span>
                                    <div class={`w-3 h-3 rounded-full ${t.primary}`}></div>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Font Style Selection */}
                    <div class="glass-card p-4 rounded-3xl space-y-3">
                        <h3 class="text-xs font-bold text-slate-700">손글씨 폰트 스타일</h3>
                        <div class="grid grid-cols-2 gap-2">
                            {[
                                { id: 'font-gowun', name: '고운돋움 (기본)' },
                                { id: 'font-gaegu', name: '개구체 ✍️' },
                                { id: 'font-gamja', name: '감자꽃체 🌸' },
                                { id: 'font-noto', name: '깔끔고딕' }
                            ].map(f => (
                                <button
                                    key={f.id}
                                    onClick={() => { triggerSound(); onChangeFont(f.id); }}
                                    class={`p-2.5 rounded-2xl text-xs flex items-center justify-center transition border ${f.id} ${
                                        fontStyle === f.id ? `${theme.primary} text-white font-bold border-transparent` : 'bg-white/80 border-slate-100 text-slate-700'
                                    }`}
                                >
                                    {f.name}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Lock Screen PIN Setting */}
                    <div class="glass-card p-4 rounded-3xl space-y-3">
                        <h3 class="text-xs font-bold text-slate-700">보안 잠금 (4자리 PIN)</h3>
                        <div class="flex items-center space-x-2">
                            <input 
                                type="password"
                                maxLength="4"
                                placeholder={pinCode ? "변경/해제 암호" : "숫자 4자리"}
                                value={newPin}
                                onChange={(e) => setNewPin(e.target.value.replace(/[^0-9]/g, ''))}
                                class="bg-white/80 text-xs px-3 py-2 rounded-xl outline-none border-0 focus:ring-1 focus:ring-pink-300 flex-1"
                            />
                            <button 
                                onClick={handlePinChange}
                                class={`px-3 py-2 rounded-xl ${theme.gradientBtn} text-xs font-bold`}
                            >
                                {pinCode ? (newPin ? '변경' : '해제') : '설정'}
                            </button>
                        </div>
                    </div>

                    {/* Sound Effect Toggle */}
                    <div class="glass-card p-4 rounded-3xl flex items-center justify-between">
                        <div>
                            <h3 class="text-xs font-bold text-slate-700">버블 효과음</h3>
                            <p class="text-[10px] text-slate-400">버튼 누를 때 터치음 재생</p>
                        </div>
                        <button 
                            onClick={() => onToggleSound(!soundEnabled)}
                            class={`w-11 h-6 rounded-full transition-colors p-1 flex items-center ${
                                soundEnabled ? theme.primary : 'bg-slate-200'
                            }`}
                        >
                            <div class={`w-4 h-4 rounded-full bg-white shadow-md transform transition-transform ${
                                soundEnabled ? 'translate-x-5' : 'translate-x-0'
                            }`}></div>
                        </button>
                    </div>

                    {/* Export & Import Backup */}
                    <div class="glass-card p-4 rounded-3xl space-y-2">
                        <h3 class="text-xs font-bold text-slate-700">백업 및 복원</h3>
                        <div class="flex space-x-2">
                            <button 
                                onClick={exportData}
                                class="flex-1 py-2 bg-white text-slate-700 rounded-xl text-xs font-bold shadow-xs hover:bg-slate-50 flex items-center justify-center space-x-1"
                            >
                                <i class="fas fa-download text-pink-400"></i>
                                <span>백업 저장</span>
                            </button>
                            <label class="flex-1 py-2 bg-white text-slate-700 rounded-xl text-xs font-bold shadow-xs hover:bg-slate-50 flex items-center justify-center space-x-1 cursor-pointer">
                                <i class="fas fa-upload text-purple-400"></i>
                                <span>복원 불러오기</span>
                                <input type="file" accept=".json" onChange={importData} class="hidden" />
                            </label>
                        </div>
                    </div>
                </div>
            );
        }

        // Lock Screen Overlay Component
        function LockScreenOverlay({ inputPin, pinError, onDigit, onDelete, onBypass, theme }) {
            return (
                <div class={`absolute inset-0 z-50 ${theme.appBg} flex flex-col items-center justify-center p-6 space-y-6 animate-fade-in`}>
                    <div class="text-center space-y-2">
                        <div class={`w-16 h-16 rounded-3xl ${theme.primary} text-white flex items-center justify-center text-2xl mx-auto shadow-lg animate-bounce`}>
                            <i class="fas fa-lock"></i>
                        </div>
                        <h2 class="text-base font-bold text-slate-800">파스텔 다이어리</h2>
                        <p class="text-xs text-slate-500">비밀번호 4자리를 입력하세요 🌸</p>
                    </div>

                    {/* PIN Display Dots */}
                    <div class={`flex space-x-4 ${pinError ? 'animate-shake' : ''}`}>
                        {[0, 1, 2, 3].map(i => (
                            <div 
                                key={i}
                                class={`w-4 h-4 rounded-full border-2 border-pink-300 transition-all ${
                                    inputPin.length > i ? `${theme.primary} scale-110` : 'bg-white/60'
                                }`}
                            ></div>
                        ))}
                    </div>

                    {/* Keypad */}
                    <div class="grid grid-cols-3 gap-3 w-64">
                        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                            <button
                                key={num}
                                onClick={() => onDigit(String(num))}
                                class="w-16 h-16 rounded-full bg-white/80 text-slate-700 font-bold text-lg shadow-sm hover:bg-white active:scale-95 transition flex items-center justify-center mx-auto"
                            >
                                {num}
                            </button>
                        ))}
                        <button 
                            onClick={onBypass}
                            class="w-16 h-16 rounded-full text-[11px] text-slate-400 font-semibold flex items-center justify-center mx-auto"
                        >
                            건너뛰기
                        </button>
                        <button
                            onClick={() => onDigit('0')}
                            class="w-16 h-16 rounded-full bg-white/80 text-slate-700 font-bold text-lg shadow-sm hover:bg-white active:scale-95 transition flex items-center justify-center mx-auto"
                        >
                            0
                        </button>
                        <button
                            onClick={onDelete}
                            class="w-16 h-16 rounded-full bg-white/40 text-slate-500 font-bold text-sm hover:bg-white/60 active:scale-95 transition flex items-center justify-center mx-auto"
                        >
                            <i class="fas fa-backspace"></i>
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
